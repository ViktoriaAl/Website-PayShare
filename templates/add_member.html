{% extends "base.html" %}

{% block title %}Новый участник{% endblock %}

{% block content %}

<div class="register_first_layer">
    <div class="register_second_layer">
        <h1 class="h-register">Добавить участника</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="email" name="email" placeholder="Email" required><br>
            <button type="submit" class="but-r">Добавить</button>
        </form>
    </div>
</div>
{% endblock %}
