{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}

<div class="register_first_layer">
    <div class="register_second_layer">
        <h1 class="h-register">Регистрация</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="name" placeholder="Имя" required><br>
            <input type="email" name="email" placeholder="Email" required><br>
            <input type="password" name="password" placeholder="Пароль" required><br>
            <button type="submit" class="but-r">Зарегистрироваться</button>
        </form>

        <div class="nav_add">
            Уже есть аккаунт? <a href="/login" class="link-login">Войти</a>
        </div>
    </div>
</div>
{% endblock %}
