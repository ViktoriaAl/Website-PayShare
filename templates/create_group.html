{% extends "base.html" %}

{% block title %}Создание группы{% endblock %}

{% block content %}

<div class="register_first_layer">
    <div class="register_second_layer">
        <h1 class="h-register">Создать группу</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="success">{{ success }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="group_name" placeholder="Название группы" required><br>
            <button type="submit">Создать группу</button>
        </form>
        <div class="nav_main">
            <a href="/" class="link-login">На главную</a>
        </div>
    </div>
</div>
{% endblock %}
